name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cli:
    name: Linux CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DATF_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Read version
        id: version
        run: echo "tag=$(./build/atfprog --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          package="dist/atfprog-${{ steps.version.outputs.tag }}-linux-x86_64"
          cmake --install build --prefix "$package"
          cp README.md CHANGELOG.md LICENSE "$package/"

      - name: Upload Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: atfprog-${{ steps.version.outputs.tag }}-linux-x86_64
          path: dist/atfprog-${{ steps.version.outputs.tag }}-linux-x86_64
          if-no-files-found: error
          retention-days: 30

  windows-cli:
    name: Windows CLI
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Read version
        id: version
        run: echo "tag=$(./build/atfprog.exe --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          package="dist/atfprog-${{ steps.version.outputs.tag }}-windows-x86_64"
          cmake --install build --prefix "$package"
          cp README.md CHANGELOG.md LICENSE "$package/"

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: atfprog-${{ steps.version.outputs.tag }}-windows-x86_64
          path: dist/atfprog-${{ steps.version.outputs.tag }}-windows-x86_64
          if-no-files-found: error
          retention-days: 30

  firmware:
    name: Arduino Leonardo firmware
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/.*kVersion\[\] = "\([^"]*\)".*/\1/p' firmware/atf1502_programmer/version.h)
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        run: |
          mkdir -p dist/firmware
          arduino-cli compile \
            --fqbn arduino:avr:leonardo \
            --output-dir dist/firmware \
            firmware/atf1502_programmer

      - name: Add release documentation
        run: cp README.md CHANGELOG.md LICENSE dist/firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: atf1502-leonardo-firmware-${{ steps.version.outputs.tag }}
          path: dist/firmware
          if-no-files-found: error
          retention-days: 30

  windows-gui:
    name: Windows GUI and installer
    needs: firmware
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    env:
      TAG: ${{ needs.firmware.outputs.tag }}
    steps:
      - name: Preserve LF line endings
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4

      - name: Download the tested firmware
        uses: actions/download-artifact@v4
        with:
          name: atf1502-leonardo-firmware-${{ needs.firmware.outputs.tag }}
          path: ci-input/firmware

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-qt6-tools
            file

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build, test and package
        run: |
          gui/packaging/build-dist.sh \
            --firmware ci-input/firmware/atf1502_programmer.ino.hex \
            --package --installer

      - name: Smoke-test the installer
        run: |
          installer="dist/atf150x-programmer-${TAG}-windows-x86_64-setup.exe"
          install_dir="$PWD/build-installer-smoke"
          MSYS2_ARG_CONV_EXCL='*' "$installer" /VERYSILENT \
            /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$(cygpath -w "$install_dir")"
          for file in atf150x-programmer.exe atfprog.exe Qt6Core.dll \
              styles/qmodernwindowsstyle.dll tools/avrdude/avrdude.exe \
              firmware/atf150x-leonardo-firmware.hex; do
            cmake -E compare_files "dist/atf150x-programmer/$file" \
              "$install_dir/$file"
          done
          cmake -E compare_files \
            ci-input/firmware/atf1502_programmer.ino.hex \
            "$install_dir/firmware/atf150x-leonardo-firmware.hex"
          "$install_dir/atfprog.exe" --version | grep -Fx "atfprog ${TAG}"
          uninstaller=$(find "$install_dir" -maxdepth 1 -iname 'unins*.exe' -print -quit)
          test -n "$uninstaller"
          MSYS2_ARG_CONV_EXCL='*' "$uninstaller" /VERYSILENT \
            /SUPPRESSMSGBOXES /NORESTART
          # The uninstaller finishes asynchronously.
          for attempt in $(seq 30); do
            test -e "$install_dir/atf150x-programmer.exe" || break
            sleep 1
          done
          test ! -e "$install_dir/atf150x-programmer.exe"

      - name: Upload GUI package and installer
        uses: actions/upload-artifact@v4
        with:
          name: atf150x-programmer-${{ needs.firmware.outputs.tag }}-windows-x86_64-gui
          path: |
            dist/atf150x-programmer-${{ needs.firmware.outputs.tag }}-windows-x86_64.zip
            dist/atf150x-programmer-${{ needs.firmware.outputs.tag }}-windows-x86_64-setup.exe
          if-no-files-found: error
          retention-days: 30

  style:
    name: Style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install formatter
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=OFF

      - name: Check formatting
        run: cmake --build build --target format-check

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux-cli
      - windows-cli
      - windows-gui
      - firmware
      - style
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify release tag
        id: version
        run: |
          version=$(sed -n 's/.*kVersion\[\] = "\([^"]*\)".*/\1/p' firmware/atf1502_programmer/version.h)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download Linux CLI
        uses: actions/download-artifact@v4
        with:
          name: atfprog-${{ steps.version.outputs.tag }}-linux-x86_64
          path: release/atfprog-${{ steps.version.outputs.tag }}-linux-x86_64

      - name: Download Windows CLI
        uses: actions/download-artifact@v4
        with:
          name: atfprog-${{ steps.version.outputs.tag }}-windows-x86_64
          path: release/atfprog-${{ steps.version.outputs.tag }}-windows-x86_64

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: atf1502-leonardo-firmware-${{ steps.version.outputs.tag }}
          path: release/atf1502-leonardo-firmware-${{ steps.version.outputs.tag }}

      - name: Download Windows GUI
        uses: actions/download-artifact@v4
        with:
          name: atf150x-programmer-${{ steps.version.outputs.tag }}-windows-x86_64-gui
          path: release

      - name: Create release archives
        working-directory: release
        run: |
          tar -czf "atfprog-${{ steps.version.outputs.tag }}-linux-x86_64.tar.gz" \
            "atfprog-${{ steps.version.outputs.tag }}-linux-x86_64"
          zip -qr "atfprog-${{ steps.version.outputs.tag }}-windows-x86_64.zip" \
            "atfprog-${{ steps.version.outputs.tag }}-windows-x86_64"
          zip -qr "atf1502-leonardo-firmware-${{ steps.version.outputs.tag }}.zip" \
            "atf1502-leonardo-firmware-${{ steps.version.outputs.tag }}"
          sha256sum *.tar.gz *.zip *.exe > SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tar.gz release/*.zip release/*.exe release/SHA256SUMS \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
